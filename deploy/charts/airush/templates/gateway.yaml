{{- if .Values.gateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-gateway
  labels:
    {{- include "airush.labels" . | nindent 4 }}
    {{- include "airush.selector" "gateway" | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      {{- include "airush.selector" "gateway" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "airush.labels" . | nindent 8 }}
        {{- include "airush.selector" "gateway" | nindent 8 }}
    spec:
      containers:
        - name: gateway
          image: "{{ .Values.image.registry }}/gateway:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--serve"]
          ports:
            - containerPort: 8081
            {{- if .Values.gateway.accept.enabled }}
            - containerPort: 8082
            - containerPort: 8083
            {{- end }}
          env:
            - name: AIRUSH_GATEWAY_LISTEN_ADDR
              value: {{ .Values.gateway.listen | quote }}
            - name: AIRUSH_COMMON_LOG_LEVEL
              value: {{ .Values.common.logLevel | quote }}
            - name: AIRUSH_COMMON_OTLP_ENDPOINT
              value: {{ .Values.common.otlpEndpoint | quote }}
            - name: AIRUSH_COMMON_TRACE_SAMPLE_RATIO
              value: {{ .Values.common.traceSampleRatio | quote }}
            - name: AIRUSH_ENV
              value: production
            {{- if .Values.gateway.accept.enabled }}
            {{- $pkiSecret := .Values.gateway.accept.externalCASecret | default (printf "%s-connector-pki" .Release.Name) }}
            - name: AIRUSH_GATEWAY_CONSOLE_URL
              value: {{ printf "http://%s-console:8080" .Release.Name | quote }}
            - name: AIRUSH_GATEWAY_SVC_TOKEN
              valueFrom:
                secretKeyRef: { name: {{ $pkiSecret }}, key: svc-token }
            - name: AIRUSH_GATEWAY_TLS_CERT_PEM
              valueFrom:
                secretKeyRef: { name: {{ $pkiSecret }}, key: gateway.crt }
            - name: AIRUSH_GATEWAY_TLS_KEY_PEM
              valueFrom:
                secretKeyRef: { name: {{ $pkiSecret }}, key: gateway.key }
            - name: AIRUSH_GATEWAY_CLIENT_CA_PEM
              valueFrom:
                secretKeyRef: { name: {{ $pkiSecret }}, key: ca.crt }
            {{- end }}
          livenessProbe:
            httpGet: { path: /healthz, port: 8081 }
            initialDelaySeconds: 2
          readinessProbe:
            httpGet: { path: /healthz, port: 8081 }
            initialDelaySeconds: 1
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          securityContext:
            {{- include "airush.securityContext" . | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-gateway
  labels:
    {{- include "airush.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "airush.selector" "gateway" | nindent 4 }}
  ports:
    - name: http
      port: 8081
      targetPort: 8081
    {{- if .Values.gateway.accept.enabled }}
    - name: enroll
      port: 8082
      targetPort: 8082
    - name: session
      port: 8083
      targetPort: 8083
    {{- end }}
{{- if gt (int .Values.gateway.replicas) 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-gateway
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "airush.selector" "gateway" | nindent 6 }}
{{- end }}
{{- end }}
