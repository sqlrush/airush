{{- if .Values.storage.builtin }}
# spec-0.10 D2：内置存储最小模板（官方镜像 + 自写，见 spec Q3——不用 bitnami）。
# 数据保护（PV Retain/反亲和/备份）随 spec-4.5 operator 路线加固（k8s-scaling §1.2）。
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-pg-conn
  labels:
    {{- include "airush.labels" . | nindent 4 }}
type: Opaque
stringData:
  dbUrl: {{ include "airush.builtinPgUrl" . | quote }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-pg
  labels:
    {{- include "airush.labels" . | nindent 4 }}
    {{- include "airush.selector" "pg" | nindent 4 }}
spec:
  serviceName: {{ .Release.Name }}-pg
  replicas: 1
  selector:
    matchLabels:
      {{- include "airush.selector" "pg" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "airush.selector" "pg" | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.storage.pg.image }}
          env:
            - name: POSTGRES_PASSWORD
              value: {{ .Values.storage.pg.password | quote }}
            - name: POSTGRES_DB
              value: airush
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 3
          resources:
            {{- toYaml .Values.storage.pg.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.storage.pg.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-pg
spec:
  selector:
    {{- include "airush.selector" "pg" | nindent 4 }}
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-redis
  labels:
    {{- include "airush.labels" . | nindent 4 }}
    {{- include "airush.selector" "redis" | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "airush.selector" "redis" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "airush.selector" "redis" | nindent 8 }}
    spec:
      containers:
        - name: redis
          image: {{ .Values.storage.redis.image }}
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 2
          resources:
            {{- toYaml .Values.storage.redis.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-redis
spec:
  selector:
    {{- include "airush.selector" "redis" | nindent 4 }}
  ports:
    - port: 6379
{{- end }}
