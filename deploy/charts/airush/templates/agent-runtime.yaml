{{- if .Values.agentRuntime.enabled }}
{{- $pkiSecret := .Values.gateway.accept.externalCASecret | default (printf "%s-connector-pki" .Release.Name) }}
{{- $mkSecret := .Values.llm.masterKeySecret | default (printf "%s-llm-master-key" .Release.Name) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-agent-runtime
  labels:
    {{- include "airush.labels" . | nindent 4 }}
    {{- include "airush.selector" "agent-runtime" | nindent 4 }}
spec:
  replicas: {{ .Values.agentRuntime.replicas }}
  selector:
    matchLabels:
      {{- include "airush.selector" "agent-runtime" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "airush.labels" . | nindent 8 }}
        {{- include "airush.selector" "agent-runtime" | nindent 8 }}
    spec:
      # spec-1.8 D5：preStop 排水（停领取 → 等在飞 turn ≤ DRAIN_TIMEOUT）→ 进程退出；
      # 330s = 300s 排水上限 + 30s 余量（k8s-scaling-design §2.1）。
      terminationGracePeriodSeconds: {{ .Values.agentRuntime.terminationGracePeriodSeconds }}
      containers:
        - name: agent-runtime
          image: "{{ .Values.image.registry }}/agent-runtime:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--serve"]
          ports:
            - containerPort: 8082
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
            - name: AIRUSH_AGENT_LISTEN_ADDR
              value: {{ .Values.agentRuntime.listen | quote }}
            - name: AIRUSH_AGENT_DB_URL
              {{- if .Values.agentRuntime.dbUrl }}
              value: {{ .Values.agentRuntime.dbUrl | quote }}
              {{- else }}
              value: {{ include "airush.builtinPgUrl" . | quote }}
              {{- end }}
            - name: AIRUSH_AGENT_LLM_URL
              value: {{ .Values.agentRuntime.llmUrl | default (printf "http://%s-llm:4000/v1" .Release.Name) | quote }}
            - name: AIRUSH_AGENT_LLM_KEY
              valueFrom:
                secretKeyRef: { name: {{ $mkSecret }}, key: master-key }
            - name: AIRUSH_AGENT_CONSOLE_URL
              value: {{ printf "http://%s-console:8080" .Release.Name | quote }}
            - name: AIRUSH_AGENT_SVC_TOKEN
              valueFrom:
                secretKeyRef: { name: {{ $pkiSecret }}, key: svc-token }
            - name: AIRUSH_AGENT_DEFAULT_MODEL
              value: {{ .Values.agentRuntime.defaultModel | quote }}
            - name: AIRUSH_AGENT_MAX_CONCURRENT_TURNS
              value: {{ .Values.agentRuntime.maxConcurrentTurns | quote }}
            - name: AIRUSH_AGENT_DRAIN_TIMEOUT
              value: {{ .Values.agentRuntime.drainTimeout | quote }}
            - name: AIRUSH_AGENT_MCP_ENDPOINTS
              value: {{ .Values.agentRuntime.mcpEndpoints | quote }}
            - name: AIRUSH_AGENT_DEFAULT_TENANT_ID
              value: {{ .Values.console.defaultTenantId | quote }}
            - name: AIRUSH_COMMON_LOG_LEVEL
              value: {{ .Values.common.logLevel | quote }}
            - name: AIRUSH_COMMON_OTLP_ENDPOINT
              value: {{ .Values.common.otlpEndpoint | quote }}
            - name: AIRUSH_COMMON_TRACE_SAMPLE_RATIO
              value: {{ .Values.common.traceSampleRatio | quote }}
            - name: AIRUSH_ENV
              value: production
          livenessProbe:
            httpGet: { path: /healthz, port: 8082 }
            initialDelaySeconds: 2
          # readyz 排水期间 503：Service 摘流量（terminating 摘除之外的双保险）
          readinessProbe:
            httpGet: { path: /readyz, port: 8082 }
            initialDelaySeconds: 1
            periodSeconds: 5
          resources:
            {{- toYaml .Values.agentRuntime.resources | nindent 12 }}
          securityContext:
            {{- include "airush.securityContext" . | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-agent-runtime
  labels:
    {{- include "airush.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "airush.selector" "agent-runtime" | nindent 4 }}
  ports:
    - name: http
      port: 8082
      targetPort: 8082
{{- if gt (int .Values.agentRuntime.replicas) 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-agent-runtime
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "airush.selector" "agent-runtime" | nindent 6 }}
{{- end }}
{{- end }}
