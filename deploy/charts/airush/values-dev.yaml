# kind 本地环境（spec-0.10 D4）：资源整体缩减、镜像用 kind load 的本地 latest
image:
  tag: latest
  pullPolicy: Never
console:
  enabled: true
  # 仅 kind 开发环境的固定 KEK（32 字节假密钥的 base64）；任何共享环境必须换 Secret
  credentialKek: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
  # dev 短采集间隔（下限护栏 15s）：加速 dev-verify Direct 采集断言（spec-1.3）
  metricsInterval: "15s"
  slowlogInterval: "60s"
  metaInterval: "300s"
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }
gateway:
  accept:
    enabled: true
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }
storage:
  builtin: true
  pg:
    resources:
      requests: { cpu: 250m, memory: 256Mi }
      limits: { cpu: "1", memory: 512Mi }
  redis:
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 250m, memory: 128Mi }
llm:
  enabled: true
  mockProvider:
    enabled: true          # sidecar 假供应商，dev-verify 不持有真实 key
  models:                  # 全部指向 mock（模板按 mockProvider 改写 litellm_params）
    - name: chat-default
      litellm: deepseek/mock-default
      apiKeyEnv: MOCK
    - name: chat-long
      litellm: deepseek/mock-long
      apiKeyEnv: MOCK
    - name: chat-fail      # 上游恒 500 的模型（mock 按名字判定），供 fallback 断言
      litellm: deepseek/mock-fail
      apiKeyEnv: MOCK
  fallbacks:
    chat-fail: [chat-default]
  resources:                 # 实测空载 ~1.05 GiB，见 values.yaml llm.resources 注释
    requests: { cpu: 200m, memory: 1280Mi }
    limits: { cpu: "1", memory: 1536Mi }
agentRuntime:
  enabled: true
  maxConcurrentTurns: 4
  drainTimeout: "60s"
  terminationGracePeriodSeconds: 90
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }
