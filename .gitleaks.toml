# gitleaks 配置（spec-0.3 security/gitleaks 消费；默认规则集全量保留）
[extend]
useDefault = true

[allowlist]
description = "已审计的公开假密钥（非真实凭据）"
regexes = [
  # kind 本地开发环境固定 KEK（32 字节 "0123456789abcdef..." 的 base64，spec-1.1 values-dev.yaml；
  # 同串曾出现在 console serve 集成测试的历史 commit，现测试已改为运行时随机生成）
  '''MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=''',
  # enrolltoken 解析器的畸形输入测试固定值（spec-1.2；全部是故意非法的假 token，用于断言拒绝）
  '''bm90LWNvbG9u\.s''',
  # spec-1.7 LiteLLM 探测脚本历史 commit 里的假 master key（sk-probe-master，仅指向本机 mock 供应商；
  # 当前版本已改为环境变量注入，此条只为让含该字面量的历史 commit 通过 PR 级扫描）
  '''sk-probe-master''',
]
paths = [
  # enrolltoken 解析器单测：整文件是对畸形/伪造 token 的拒绝断言，无真实凭据
  '''console/internal/enrolltoken/enrolltoken_test\.go''',
]
