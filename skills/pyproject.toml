[project]
name = "airush-skills"
version = "0.0.0"
description = "AIRush skill services (scaffold placeholder, framework lands in spec-1.9)"
requires-python = ">=3.12"
dependencies = ["pydantic-settings>=2.7"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.12",
    "mypy>=1.14",
    "testcontainers[redis]>=4.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["airush_skills"]
